<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Task & Idea Tracker</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center py-10 px-4">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-6 border border-slate-100">
        <h1 class="text-2xl font-bold text-slate-800 text-center mb-6">Task & Idea Tracker</h1>

        <div class="flex gap-2 mb-6">
            <input type="text" id="taskInput" placeholder="Write a new task or idea..." 
                class="flex-1 px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
            <button onclick="addTask()" 
                class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2 rounded-lg transition duration-200 text-sm">
                Add
            </button>
        </div>

        <ul id="taskList" class="space-y-3"></ul>
    </div>

    <!-- Linking external JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
